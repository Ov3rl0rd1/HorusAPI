# ==============================================================================
#  Обнаружение блокировки узла по IP.
#
#  Задача не в том, чтобы понять, что узел упал — это делают правила в
#  infra.yml. Задача обратная и куда неприятнее: узел **жив, здоров и доступен**,
#  просто не оттуда, откуда к нему идут пользователи. Ни одна проверка с
#  зарубежного сервера этого не увидит по определению — нужен взгляд изнутри
#  страны, и здесь их два.
#
#  1. Косвенный, из данных, которые уже собираются: узел здоров, xray отвечает,
#     пользователи на нём числятся — и ни одного онлайн. Ничего ставить не надо.
#  2. Прямой, из пробника в РФ (см. monitoring/ru-probe/). Видит блокировку
#     раньше, чем её увидят пользователи, но требует площадки в стране.
# ==============================================================================

groups:

  - name: blocking-inferred
    interval: 1m
    rules:

      # Главное правило этого файла, и оно не стоит ничего.
      #
      # «Ноль онлайн» само по себе ничего не значит — ночью так и есть. Значимо
      # другое: ноль онлайн на узле, у которого **в последние шесть часов они
      # были**. Это и отделяет блокировку от затишья, и заодно от нового узла,
      # на который ещё никто не пришёл.
      #
      # Всё остальное при этом зелёное: скрейп идёт, значит узел доступен нам;
      # xray отвечает, значит данные плоскость жива. Узел работает — к нему
      # просто перестали доходить.
      - alert: NodeReachableButNobodyConnects
        expr: |
          horus_node_users_online == 0
          and horus_xray_up == 1
          and max_over_time(horus_node_users_online[6h]) >= 3
        for: 20m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.server }}: узел жив, но никто не может подключиться"
          description: >-
            За последние шесть часов на узле были пользователи, сейчас ноль, при этом
            xray отвечает и метрики собираются. Так выглядит блокировка адреса: снаружи
            всё в порядке, изнутри страны не доходит. Проверьте адрес пробником из РФ и
            в реестре, затем уводите пользователей:
            POST /admin/servers/{id}/evacuate.

      # Более мягкая версия: онлайн не ноль, но обвалился. Ловит частичную
      # блокировку — часть операторов режет, часть ещё нет.
      - alert: NodeOnlineCollapsed
        expr: |
          horus_node_users_online < 0.25 * max_over_time(horus_node_users_online[6h])
          and max_over_time(horus_node_users_online[6h]) >= 8
          and horus_xray_up == 1
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.server }}: онлайн упал вчетверо"
          description: >-
            Похоже на блокировку у части операторов: узел здоров, но доходят до него
            уже не все. Стоит посмотреть, с каких сетей приходят оставшиеся.

  - name: blocking-probed
    interval: 30s
    rules:

      # Прямой сигнал: пробник в России не может открыть TCP-соединение к узлу,
      # а мы — можем. Вместе это и есть определение блокировки по IP.
      #
      # Разделение принципиальное: если узел не отвечает **и нам тоже**, это
      # авария узла, и о ней уже кричит ServerUnreachable. Правило без второй
      # половины дублировало бы её и путало две совершенно разные ситуации.
      - alert: NodeBlockedFromRussia
        expr: |
          probe_success{job="ru-probe"} == 0
          and on (server) up{job="horus-host"} == 1
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.server }}: не открывается из России"
          description: >-
            Пробник в РФ десять минут не может установить соединение, при этом узел
            отвечает нам. Это блокировка по адресу, а не авария. Уводите пользователей
            (POST /admin/servers/{id}/evacuate) и меняйте адрес.

      # Пробник — единственная точка обзора изнутри страны, и его молчание
      # означает, что этой точки обзора нет. Отдельный алерт, потому что иначе
      # отсутствие сигнала читается как «всё хорошо».
      - alert: RussianProbeSilent
        expr: up{job="ru-probe"} == 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Пробник в РФ не отвечает"
          description: >-
            Пока он молчит, блокировку узла видно только по косвенным признакам —
            то есть с задержкой и уже по жалобам пользователей.
