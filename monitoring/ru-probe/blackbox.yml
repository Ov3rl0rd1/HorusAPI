# Только TCP-рукопожатие. Не HTTP и не TLS: у узла на 443 стоит REALITY,
# который на непрошеного гостя отвечает как чужой сайт, а на 8443 — QUIC,
# который blackbox не умеет. Вопрос, на который надо ответить, проще любого из
# них: доходит ли до адреса вообще хоть что-нибудь.
modules:
  tcp_connect:
    prober: tcp
    timeout: 5s
    tcp:
      # Блокировки по IP на IPv6 в РФ пока редкость, а лишний адресный
      # семейный промах дал бы ложную тревогу.
      preferred_ip_protocol: ip4
      ip_protocol_fallback: false
