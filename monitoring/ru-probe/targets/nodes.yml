# Что проверять. host:port — тот порт, на который реально ходят клиенты, а не
# управляющий: блокируют адрес, но проверять надо путь, которым пользуются.
#
# Метка server обязана совпадать с monitoring/targets/hosts.yml, иначе алерт
# NodeBlockedFromRussia не сможет сопоставить пробу с узлом и не сработает
# никогда — молча.

- targets: ["ch1.horusping.com:443"]
  labels:
    server: ch1
