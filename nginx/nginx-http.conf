# HTTP-only template — rendered by entrypoint.sh when USE_SSL=0.
# Plain HTTP on port 80: no TLS, no certbot, no redirect.
# ${DOMAIN} is replaced at container startup by entrypoint.sh.
# Do not use ${...} syntax for nginx variables here — only ${DOMAIN} is substituted.

server {
    listen      80;
    server_name ${DOMAIN};

    sendfile            off;
    tcp_nopush          off;
    tcp_nodelay         on;
    
    proxy_buffers           8 16k;
    proxy_buffer_size       16k;
    fastcgi_buffers         16k 16k;
    fastcgi_buffer_size     32k;

    # ── Security headers (no HSTS — that requires HTTPS) ──────────────────────
    add_header X-Content-Type-Options nosniff      always;
    add_header X-Frame-Options        DENY          always;
    add_header Referrer-Policy        "no-referrer" always;

    include /etc/nginx/mime.types;

    # ── Shared routing (API proxy + static placeholder) ──────────────────────
    include /etc/nginx/locations.conf;
}
