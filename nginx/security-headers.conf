# Security headers, repeated per location.
#
# nginx's add_header directives are inherited from the previous level ONLY while
# the current level defines none of its own. The moment a location adds a single
# add_header (a Cache-Control, say), the whole inherited set is dropped from
# those responses. Every location below that sets any header therefore includes
# this file, so the four headers survive everywhere instead of silently
# disappearing from static assets, downloads and the reset page.
#
# HSTS comes from the $hsts_header map (defined next to the server block), which
# yields an empty string on plain HTTP — and nginx omits a header whose value is
# empty. That keeps this one file correct in both USE_SSL=1 and USE_SSL=0 modes.

add_header Strict-Transport-Security $hsts_header  always;
add_header X-Content-Type-Options    nosniff       always;
add_header X-Frame-Options           DENY          always;
add_header Referrer-Policy           "no-referrer" always;
