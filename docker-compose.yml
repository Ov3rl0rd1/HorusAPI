services:

  # ── Database ──────────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB:       ${POSTGRES_DB:-horus}
      POSTGRES_USER:     ${POSTGRES_USER:-horus}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-horus} -d ${POSTGRES_DB:-horus}"]
      interval: 5s
      timeout: 5s
      retries: 5
    command: >
      postgres 
      -c shared_buffers=48MB 
      -c work_mem=4MB 
      -c maintenance_work_mem=16MB 
      -c max_connections=20
    deploy:
      resources:
        limits:
          memory: 250M
    # No ports — postgres is accessible only within the Docker network

  # ── Outbound mail (Postfix, internal only) ───────────────────────────────────
  # Relays verification emails directly — no SendGrid/SES/etc. Needs SPF/DKIM/
  # DMARC/PTR records for ${DOMAIN} to actually land in inboxes (see chat above).
  mailserver:
    image: boky/postfix:latest-alpine   # pin a version — check releases page for current
    restart: unless-stopped
    environment:
      HOSTNAME: mail.${DOMAIN}
      # Codes and reset links are sent from no-reply@mail.${DOMAIN}, so the mail
      # subdomain has to be allowed as a sender too — postfix matches the exact domain.
      ALLOWED_SENDER_DOMAINS: "${DOMAIN} mail.${DOMAIN}"
      DKIM_AUTOGENERATE: "true"
      POSTFIX_mynetworks: "127.0.0.0/8 172.16.0.0/12"
    volumes:
      - dkim-keys:/etc/opendkim/keys
    healthcheck:
      test: ["CMD-SHELL", "postfix status > /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 128M

  # ── API (HTTP, internal only) ─────────────────────────────────────────────────
  vpn-api:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      mailserver:
        condition: service_started
    env_file: .env
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      DOTNET_GCHeapHardLimit: 250000000
      DOTNET_ServerGarbageCollection: 0
      ASPNETCORE_URLS:        http://+:8080
      ConnectionStrings__Postgres: "Host=postgres;Port=5432;Database=${POSTGRES_DB:-horus};Username=${POSTGRES_USER:-horus};Password=${POSTGRES_PASSWORD};Gss Encryption Mode=Disable;"
      # Outbound mail (confirmation codes + password-reset links). The hop to
      # postfix never leaves the compose network, hence no auth and no TLS.
      # Set MAIL_ENABLED=false to log codes instead of sending them.
      Mail__Enabled:  ${MAIL_ENABLED:-true}
      Mail__Host:     mailserver
      Mail__Port:     "587"
      Mail__From:     no-reply@mail.${DOMAIN}
      Mail__FromName: "Horus Ping Booster"
      # Origin used to build reset links. Empty falls back to https://${DOMAIN};
      # set PUBLIC_URL in .env for HTTP-only deploys (USE_SSL=0).
      App__PublicUrl: ${PUBLIC_URL:-}
    deploy:
      resources:
        limits:
          memory: 350M
    # No external ports — traffic reaches the API only through nginx

  # ── Reverse proxy + automatic TLS ────────────────────────────────────────────
  # On first start nginx obtains a Let's Encrypt cert for ${DOMAIN}.
  # Renewal runs automatically every 12 h inside the container.
  nginx:
    build: ./nginx
    restart: unless-stopped
    depends_on:
      - vpn-api
    env_file: .env
    environment:
      DOMAIN:          ${DOMAIN}
      CERTBOT_EMAIL:   ${CERTBOT_EMAIL}
      USE_SSL:         ${USE_SSL:-1}
      CERTBOT_STAGING: ${CERTBOT_STAGING:-0}
      # Client release mirror: the container pulls the newest release from this
      # GitHub repo and serves it from /download (see nginx/sync-releases.sh).
      RELEASE_REPO:               ${RELEASE_REPO:-Ov3rl0rd1/Horus-Release}
      RELEASE_INCLUDE_PRERELEASE: ${RELEASE_INCLUDE_PRERELEASE:-1}
      RELEASE_SYNC_INTERVAL:      ${RELEASE_SYNC_INTERVAL:-3600}
      # Optional — only to raise the GitHub API rate limit (60/h per IP without).
      GITHUB_TOKEN:               ${GITHUB_TOKEN:-}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # Persist Let's Encrypt certs across container restarts / rebuilds
      - letsencrypt:/etc/letsencrypt
      # Mirrored release binaries (~300 MB) — kept out of the image so a rebuild
      # does not re-download them
      - downloads:/var/www/downloads
    deploy:
      resources:
        limits:
          memory: 128M

volumes:
  pgdata:
  letsencrypt:
  dkim-keys:
  downloads:
