<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Оплата (тест) — Horus VPN</title>
<link rel="icon" type="image/svg+xml" href="/logo-gold.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;700;800&amp;family=Manrope:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
<link rel="stylesheet" href="/css/account.css">
<script type="module" src="/js/pay.js"></script>
</head>
<body>

<div class="orbs" aria-hidden="true">
  <div class="orb orb--a"></div>
  <div class="orb orb--b orb--bottom"></div>
</div>

<nav class="nav">
  <a class="brand" href="/">
    <img class="brand__logo" src="/logo-gold.svg" alt="Horus">
    <span class="brand__word">HORUS</span>
  </a>
  <div class="nav__links">
    <a class="nav__link" href="/cabinet">Кабинет</a>
    <a class="nav__link" href="/connect">Подключение</a>
    <button class="nav__link link-btn nav__logout" id="logout" type="button">Выйти</button>
  </div>
</nav>

<main class="acc-main">

  <div class="acc-head">
    <div>
      <div class="eyebrow">ОПЛАТА · ТЕСТ</div>
      <h1 class="h2">Тестовая страница оплаты</h1>
    </div>
    <a class="btn btn--quiet" href="/cabinet">В кабинет</a>
  </div>

  <!-- Текущая подписка -->
  <div class="acc-grid">
    <div class="card tile tile__wide">
      <div class="tile__kind">ТЕКУЩАЯ ПОДПИСКА</div>
      <div class="tile__value tile__value--accent" id="sub-state">—</div>
      <div class="tile__note" id="sub-note"></div>
      <div class="acc-actions">
        <button class="btn btn--quiet" id="cancel-btn" type="button" hidden data-label="Отменить автопродление">Отменить автопродление</button>
      </div>
      <p class="msg" id="return-msg" role="status" style="margin-top:12px"></p>
    </div>
  </div>

  <!-- Выбор тарифа -->
  <div class="acc-grid">
    <div class="card tile tile__wide">
      <div class="tile__kind">ВЫБЕРИТЕ ТАРИФ</div>

      <section id="state-loading" class="state is-active">
        <div class="checking">
          <div class="spinner" role="status" aria-label="Загружаем тарифы"></div>
          <p>Загружаем тарифы…</p>
        </div>
      </section>

      <section id="state-empty" class="state">
        <p class="tile__note" style="margin-top:0">Нет доступных тарифов. Засейте таблицу <code>plans</code> в БД
          (см. <code>docs/payments.md</code>), затем обновите страницу.</p>
      </section>

      <section id="state-plans" class="state">
        <div class="srv-list" id="plan-list"></div>

        <label class="tile__kind" for="promo" style="display:block;margin-top:18px">ПРОМОКОД (необязательно, только для разовых)</label>
        <input id="promo" type="text" autocomplete="off" spellcheck="false"
               placeholder="PROMO"
               style="width:100%;max-width:280px;margin-top:8px;padding:12px 14px;border-radius:12px;
                      background:rgba(11,5,18,.5);border:1px solid rgba(255,255,255,.14);color:var(--text);
                      font:600 14px var(--font)">

        <div class="acc-actions">
          <button class="btn btn--primary btn--wide" id="pay-btn" type="button" disabled data-label="Перейти к оплате">Перейти к оплате</button>
        </div>
        <p class="msg msg--error" id="pay-msg" role="alert"></p>
      </section>
    </div>
  </div>

</main>

<footer class="footer">
  <div class="footer__brand">
    <img class="footer__logo" src="/logo-gold.svg" alt="">
    © 2026 Horus VPN
  </div>
  <div>Поддержка: <a href="mailto:horusping@gmail.com">horusping@gmail.com</a> · <a href="https://t.me/horusping">@horusping</a></div>
</footer>

</body>
</html>
