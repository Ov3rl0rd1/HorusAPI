<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HorusVPN</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0a0a0f;
      color: #e2e8f0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    .card {
      text-align: center;
      padding: 3rem 2.5rem;
      max-width: 420px;
    }

    .logo {
      font-size: 3rem;
      margin-bottom: 1rem;
      filter: drop-shadow(0 0 24px #6366f1aa);
    }

    h1 {
      font-size: 2rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: #f8fafc;
      margin-bottom: 0.5rem;
    }

    .tagline {
      font-size: 1rem;
      color: #94a3b8;
      margin-bottom: 2rem;
    }

    .badge {
      display: inline-block;
      padding: 0.35rem 1rem;
      border-radius: 9999px;
      background: #1e1e2e;
      border: 1px solid #6366f133;
      color: #818cf8;
      font-size: 0.8rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">🔒</div>
    <h1>HorusVPN</h1>
    <p class="tagline">Secure. Fast. Private.</p>
    <span class="badge">Coming soon</span>
  </div>
</body>
</html>
