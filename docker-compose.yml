version: "3.9"

services:

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB:       ${POSTGRES_DB:-horus}
      POSTGRES_USER:     ${POSTGRES_USER:-horus}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-horus} -d ${POSTGRES_DB:-horus}"]
      interval: 5s
      timeout: 5s
      retries: 5

  nginx:
    image: nginx

  hysteria:
    image: tobyxdd/hysteria:latest
    restart: unless-stopped
    ports:
      - "443:443"
      - "20000-50000:443"


  vpn-api:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "443:443"
    env_file: .env
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      # Connection string – assembled from .env variables
      ConnectionStrings__Postgres: "Host=postgres;Port=5432;Database=${POSTGRES_DB:-horus};Username=${POSTGRES_USER:-horus};Password=${POSTGRES_PASSWORD}"
      # Certificate paths – mounted from the Hysteria2 server cert directory
      # Set CERT_DIR in .env to the directory that contains fullchain.pem and privkey.pem
      Kestrel__Certificates__Default__Path:    /certs/fullchain.pem
      Kestrel__Certificates__Default__KeyPath: /certs/privkey.pem
    volumes:
      # Mount Hysteria2's Let's Encrypt cert directory read-only.
      # Override CERT_DIR in .env (default: /etc/hysteria).
      - ${CERT_DIR:-/etc/hysteria}:/certs:ro

volumes:
  pgdata:
