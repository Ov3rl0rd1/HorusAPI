# Shared routing — included by both the HTTPS (nginx.conf) and HTTP-only
# (nginx-http.conf) server blocks so the two modes never drift apart.
# Copied verbatim to /etc/nginx/locations.conf (NOT processed by envsubst),
# so nginx $variables below are left intact.
#
# Every location that sets an add_header of its own also includes
# security-headers.conf — see that file for why.


# ── API routes → vpn-api (internal Docker network, HTTP) ──────────────────────
location ~ ^/(auth|servers|admin|health|node|whoami)(/|$) {
    proxy_pass         http://vpn-api:8080;
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_set_header   Connection        "";
    proxy_read_timeout 30s;
    proxy_send_timeout 30s;
}

# Password-reset form. Reset e-mails link to /reset?token=… , so the page must be
# served here and not swallowed by the fallback below. Never cached: the page
# is short-lived and always re-validates its token against /auth/reset-check.
# reset.html loads its CSS/JS by absolute path (/css/…, /js/…) precisely because
# it is served from an extension-less URL.
location = /reset {
    root         /usr/share/nginx/html;
    default_type text/html;
    include      /etc/nginx/security-headers.conf;
    add_header   Cache-Control "no-store" always;
    try_files    /reset.html =404;
}

# ── Client downloads ──────────────────────────────────────────────────────────
# /var/www/downloads/current is a symlink to the newest release mirrored from
# GitHub by sync-releases.sh, so these URLs never change between versions:
#   /download/latest.json                 manifest (version, sizes, checksums)
#   /download/Horus-win-x64.msi           newest build, stable name
#   /download/files/Horus-0.1.0-win…msi   exact release file name
# Both blocks are ^~ / = so no regex location can steal them.

location = /download/latest.json {
    alias        /var/www/downloads/current/latest.json;
    default_type application/json;
    include      /etc/nginx/security-headers.conf;
    add_header   Cache-Control "no-store" always;
}

location ^~ /download/ {
    alias     /var/www/downloads/current/;
    autoindex off;

    # A location-level types block replaces the inherited map entirely, so it
    # has to name every extension served from here.
    types {
        application/vnd.android.package-archive apk;
        application/x-msi                       msi;
        application/zip                         zip;
        text/plain                              txt;
        application/json                        json;
    }
    default_type application/octet-stream;

    include    /etc/nginx/security-headers.conf;
    add_header Content-Disposition "attachment" always;
    # The stable names point at whatever the newest build is, so a cached copy
    # goes stale on the next release — always revalidate, ETag saves the bytes.
    add_header Cache-Control "public, max-age=0, must-revalidate" always;

    # ~100 MB files: hand them to the kernel, but in chunks, so one download
    # cannot monopolise a worker.
    sendfile           on;
    sendfile_max_chunk 1m;
}

# ── Static assets ─────────────────────────────────────────────────────────────
# Split in two, because the site's CSS and JS carry no content hash in their
# names. Caching them for 30 days the way images can be cached would leave a
# browser running last release's js/*.js against this release's HTML — which
# revalidates on every load — and the two would disagree until the cache aged
# out. So code revalidates (ETag → 304, no bytes on the wire) while genuinely
# static media keeps the long cache.

location ~* \.(?:js|mjs|css)$ {
    root       /usr/share/nginx/html;
    include    /etc/nginx/security-headers.conf;
    add_header Cache-Control "no-cache" always;
}

location ~* \.(?:svg|png|jpg|jpeg|gif|ico|webp|woff|woff2|ttf)$ {
    root       /usr/share/nginx/html;
    access_log off;
    include    /etc/nginx/security-headers.conf;
    add_header Cache-Control "public, max-age=2592000, no-transform" always;
}

# ── Pages ─────────────────────────────────────────────────────────────────────
# The site is a set of real .html files (index, login, cabinet, connect, docs/*),
# not a single-page app, so there is no catch-all rewrite to index.html: an
# unknown path is a genuine 404 rather than the landing page served under the
# wrong URL. $uri.html lets /cabinet and /login work without the extension.
location / {
    root      /usr/share/nginx/html;
    index     index.html;
    try_files $uri $uri.html $uri/ =404;

    include    /etc/nginx/security-headers.conf;
    # HTML changes on every deploy — let the browser keep a copy, but never use
    # it without asking first (ETag → 304).
    add_header Cache-Control "no-cache" always;
}
