version: "3.9"

services:

  # ── Database ──────────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB:       ${POSTGRES_DB:-horus}
      POSTGRES_USER:     ${POSTGRES_USER:-horus}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-horus} -d ${POSTGRES_DB:-horus}"]
      interval: 5s
      timeout: 5s
      retries: 5
    # No ports — postgres is accessible only within the Docker network

  # ── API (HTTP, internal only) ─────────────────────────────────────────────────
  vpn-api:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file: .env
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS:        http://+:8080
      ConnectionStrings__Postgres: "Host=postgres;Port=5432;Database=${POSTGRES_DB:-horus};Username=${POSTGRES_USER:-horus};Password=${POSTGRES_PASSWORD}"
    # No external ports — traffic reaches the API only through nginx

  # ── Reverse proxy + automatic TLS ────────────────────────────────────────────
  # On first start nginx obtains a Let's Encrypt cert for ${DOMAIN}.
  # Renewal runs automatically every 12 h inside the container.
  nginx:
    build: ./nginx
    restart: unless-stopped
    depends_on:
      - vpn-api
    env_file: .env
    environment:
      DOMAIN:          ${DOMAIN}
      CERTBOT_EMAIL:   ${CERTBOT_EMAIL}
      CERTBOT_STAGING: ${CERTBOT_STAGING:-0}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # Persist Let's Encrypt certs across container restarts / rebuilds
      - letsencrypt:/etc/letsencrypt

volumes:
  pgdata:
  letsencrypt:
