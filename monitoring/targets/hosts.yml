# Host-level metrics (node-exporter) for every Horus server.
#
# `targets` is host:port as nginx publishes it — the MAIN server terminates TLS
# on 443, a NODE on its CONTROL_PORT (8444 by default).
#
# The hostname MUST be one the server's certificate actually covers. A node that
# answers on two names but holds a cert for only one fails the scrape with an
# x509 error, which reads as "node down" — the same trap that took Hysteria out.
#
# Adding a server: append a block here. VM re-reads this file within a minute;
# nothing needs restarting.

- targets: ["horusping.com:443"]
  labels:
    server: main
    role:   central

- targets: ["ch1.horusping.com:8444"]
  labels:
    server: ch1
    role:   node
