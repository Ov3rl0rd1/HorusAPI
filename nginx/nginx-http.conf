# HTTP-only template — rendered by entrypoint.sh when USE_SSL=0.
# Plain HTTP on port 80: no TLS, no certbot, no redirect.
# ${DOMAIN} is replaced at container startup by entrypoint.sh.
# Do not use ${...} syntax for nginx variables here — only ${DOMAIN} is substituted.

# Same map as the HTTPS template, so security-headers.conf works in both modes.
# $scheme is always "http" here, so HSTS resolves to an empty string and nginx
# omits it — HSTS over plain HTTP would be ignored by browsers anyway.
map $scheme $hsts_header {
    https   "max-age=63072000; includeSubDomains";
    default "";
}

server {
    listen      80;
    server_name ${DOMAIN};

    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile            off;
    tcp_nopush          off;
    tcp_nodelay         on;

    proxy_buffers           8 16k;
    proxy_buffer_size       16k;
    proxy_busy_buffers_size 32k;

    # ── Security headers (HSTS resolves to empty here — see the map above) ────
    include /etc/nginx/security-headers.conf;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    gzip_min_length 1000;

    # ── Shared routing (API proxy + site) ────────────────────────────────────
    include /etc/nginx/locations.conf;
}
