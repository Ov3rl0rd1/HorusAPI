# Shared routing — included by both the HTTPS (nginx.conf) and HTTP-only
# (nginx-http.conf) server blocks so the two modes never drift apart.
# Copied verbatim to /etc/nginx/locations.conf (NOT processed by envsubst),
# so nginx $variables below are left intact.

# ── API routes → vpn-api (internal Docker network, HTTP) ──────────────────────
location ~ ^/(auth|servers|admin|health)(/|$) {
    proxy_pass         http://vpn-api:8080;
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_set_header   Connection        "";
    proxy_read_timeout 30s;
    proxy_send_timeout 30s;
}

# ── Everything else → static placeholder ──────────────────────────────────────
location / {
    root  /usr/share/nginx/html;
    index index.html;
    try_files $uri $uri/ /index.html;
}
