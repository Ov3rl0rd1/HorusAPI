version: "3.9"

services:

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB:       vpndb
      POSTGRES_USER:     vpnuser
      POSTGRES_PASSWORD: CHANGE_ME
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vpnuser -d vpndb"]
      interval: 5s
      timeout: 5s
      retries: 5

  vpn-api:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS:        http://+:8080
      # Override connection string and JWT secret via env (never commit real secrets)
      ConnectionStrings__Postgres: "Host=postgres;Port=5432;Database=vpndb;Username=vpnuser;Password=CHANGE_ME"
      Jwt__Secret:   "REPLACE_WITH_AT_LEAST_32_RANDOM_CHARS_HERE_!!"
      Jwt__Issuer:   "vpn-auth-api"
      Jwt__Audience: "vpn-clients"
      Jwt__ExpiryMinutes: "60"

volumes:
  pgdata:
