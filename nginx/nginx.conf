# HTTPS template — rendered by entrypoint.sh when USE_SSL=1.
# ${DOMAIN} is replaced at container startup by entrypoint.sh.
# Do not use ${...} syntax for nginx variables here — only ${DOMAIN} is substituted.
# Routing lives in locations.conf so HTTP-only mode (nginx-http.conf) stays in sync.

# ── HTTP: ACME challenge + redirect ───────────────────────────────────────────
server {
    listen      80;
    listen      [::]:80;
    server_name ${DOMAIN};

    # Certbot webroot challenge — must remain on port 80 for renewals too
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS entry point ─────────────────────────────────────────────────────────
server {
    listen      443 ssl;
    listen      [::]:443 ssl;
    http2       on;
    server_name ${DOMAIN};

    # ── TLS (Let's Encrypt certs managed automatically) ───────────────────────
    ssl_certificate     /etc/letsencrypt/live/${DOMAIN}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/${DOMAIN}/privkey.pem;

    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_ciphers               ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256;
    ssl_prefer_server_ciphers off;
    ssl_session_cache         shared:SSL:10m;
    ssl_session_timeout       1d;
    ssl_session_tickets       off;

    # ── Security headers ──────────────────────────────────────────────────────
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options    nosniff                                always;
    add_header X-Frame-Options           DENY                                   always;
    add_header Referrer-Policy           "no-referrer"                          always;

    include /etc/nginx/mime.types;

    # ── Shared routing (API proxy + static placeholder) ──────────────────────
    include /etc/nginx/locations.conf;
}
